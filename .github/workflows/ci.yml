name: ci
on: [push, pull_request]
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned toolchain (rust-toolchain.toml)
        run: rustup show
      - name: Windows build
        if: matrix.os == 'windows-latest'
        run: cargo build --workspace --locked
      - run: cargo fmt --check --all
      - run: cargo clippy --workspace --locked -- -D warnings
      - run: cargo test --workspace --locked
      - name: Install cargo-deny (Linux only)
        if: matrix.os == 'ubuntu-latest'
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny@0.20.2
      - name: Audit workspace dependencies (Linux only)
        if: matrix.os == 'ubuntu-latest'
        run: cargo deny --workspace --locked check
      - name: Install musl compiler (Linux only)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools
          musl-gcc --version
      - name: musl check (Linux only)
        if: matrix.os == 'ubuntu-latest'
        run: |
          rustup target add x86_64-unknown-linux-musl
          cargo check --workspace --locked --target x86_64-unknown-linux-musl
